server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hashed build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The VitePress docs site is a separate static build under /docs — give it
    # its own asset caching and its own fallback so an unknown /docs/* path
    # doesn't resolve to the app's index.html.
    location ^~ /docs/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /docs/ {
        try_files $uri $uri/ /docs/index.html;
    }

    # SPA fallback: unknown paths resolve to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
