            return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
        }
        function rgb2hex(r) { return '#' + r.map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join(''); }
        function mix(a, b, t) { const A = hex2rgb(a), B = hex2rgb(b); return rgb2hex([0, 1, 2].map(i => A[i] * (1 - t) + B[i] * t)); }

        /* ============================================================
           State
           ============================================================ */
        const STORE = 'architect-diagram-v1';

        function blank() {
            return { title: 'Untitled diagram', nodes: [], edges: [], theme: 'light', snap: true, grid: true };
        }

        let state = blank();
        let view = { x: 0, y: 0, k: 1 };
        let sel = new Set();          // selected node + edge ids
        let hoverId = null;
        let tool = 'select';
        let spaceDown = false;
        let drag = null;
        let past = [], future = [];
        let lastType = PALETTE[0].items[0];

        const nodeById = id => state.nodes.find(n => n.id === id);
        const edgeById = id => state.edges.find(e => e.id === id);
        const selNodes = () => state.nodes.filter(n => sel.has(n.id));
        const selEdges = () => state.edges.filter(e => sel.has(e.id));

        function mark() { past.push(clone({ nodes: state.nodes, edges: state.edges, title: state.title })); if (past.length > 120) past.shift(); future.length = 0; }

        function undo() {
            if (!past.length) return;
            future.push(clone({ nodes: state.nodes, edges: state.edges, title: state.title }));
            const p = past.pop();
            state.nodes = p.nodes; state.edges = p.edges; state.title = p.title;
            $('#docTitle').value = state.title;
            pruneSel(); render(); inspect(); save();
        }
        function redo() {
            if (!future.length) return;
            past.push(clone({ nodes: state.nodes, edges: state.edges, title: state.title }));
            const f = future.pop();
            state.nodes = f.nodes; state.edges = f.edges; state.title = f.title;
            $('#docTitle').value = state.title;
            pruneSel(); render(); inspect(); save();
        }
        function pruneSel() {
            const ids = new Set([...state.nodes.map(n => n.id), ...state.edges.map(e => e.id)]);
            [...sel].forEach(id => { if (!ids.has(id)) sel.delete(id); });
        }

        let saveTimer = null;
        function save() {
            clearTimeout(saveTimer);
            saveTimer = setTimeout(() => {
                try { localStorage.setItem(STORE, JSON.stringify(state)); } catch (e) { }
            }, 250);
        }

        /* ============================================================
           Theme colours (resolved for rendering + export)
           ============================================================ */
        function theme() {
            const dark = state.theme === 'dark';
            return {
                dark,
                bg: dark ? '#0f1113' : '#ffffff',
                surface: dark ? '#181b1f' : '#ffffff',
                ink: dark ? '#e8eaed' : '#141414',
                muted: dark ? '#949aa2' : '#767676',
                line: dark ? '#2c3138' : '#dcdcdc',
                grid: dark ? '#1b1f24' : '#eeeeee',
                edge: dark ? '#8b939d' : '#6a7280',
                sel: dark ? '#5b9dff' : '#2f6fdb'
            };
        }

        function nodePaint(n) {
            const T = theme();
            const acc = C[n.color] || n.color || C.slate;
            if (n.shape === 'group') {
                return { acc, fill: mix(acc, T.bg, T.dark ? 0.93 : 0.965), stroke: mix(acc, T.bg, 0.45), ink: T.ink, muted: T.muted };
            }
            return {
                acc,
                fill: mix(acc, T.surface, T.dark ? 0.9 : 0.955),
                stroke: mix(acc, T.surface, T.dark ? 0.62 : 0.55),
                ink: T.ink,
                muted: T.muted
            };
        }

        /* ============================================================
           Geometry — shapes
           ============================================================ */
        function rr(x, y, w, h, r) {
            r = Math.min(r, w / 2, h / 2);
            return `M${x + r},${y}H${x + w - r}A${r},${r} 0 0 1 ${x + w},${y + r}V${y + h - r}A${r},${r} 0 0 1 ${x + w - r},${y + h}H${x + r}A${r},${r} 0 0 1 ${x},${y + h - r}V${y + r}A${r},${r} 0 0 1 ${x + r},${y}Z`;
        }

        function shapeMarkup(n, p, extraAttr) {
            const { x, y, w, h } = n, a = extraAttr || '';
            const base = `fill="${p.fill}" stroke="${p.stroke}" stroke-width="1.5"`;
            switch (n.shape) {
                case 'pill': return `<path d="${rr(x, y, w, h, h / 2)}" ${base} ${a}/>`;
                case 'round': return `<path d="${rr(x, y, w, h, 16)}" ${base} ${a}/>`;
                case 'group': return `<path d="${rr(x, y, w, h, 12)}" fill="${p.fill}" stroke="${p.stroke}" stroke-width="1.5" stroke-dasharray="7 5" ${a}/>`;
                case 'cyl': {
                    const ry = Math.min(15, h * 0.22);
                    const body = `M${x},${y + ry}C${x},${y - ry * .333} ${x + w},${y - ry * .333} ${x + w},${y + ry}` +
                        `L${x + w},${y + h - ry}C${x + w},${y + h + ry * .333} ${x},${y + h + ry * .333} ${x},${y + h - ry}Z`;
                    const rim = `M${x},${y + ry}C${x},${y + ry + ry * 1.333} ${x + w},${y + ry + ry * 1.333} ${x + w},${y + ry}`;
                    return `<path d="${body}" ${base} ${a}/><path d="${rim}" fill="none" stroke="${p.stroke}" stroke-width="1.5"/>`;
                }
                case 'queue': {
                    const bars = [w - 10, w - 19, w - 28].map(dx =>
                        `<line x1="${x + dx}" y1="${y + 8}" x2="${x + dx}" y2="${y + h - 8}" stroke="${p.stroke}" stroke-width="1.5"/>`).join('');
                    return `<path d="${rr(x, y, w, h, 6)}" ${base} ${a}/>${bars}`;
                }
                case 'hex': {
                    const i = Math.min(22, w * 0.16);
                    return `<path d="M${x + i},${y}H${x + w - i}L${x + w},${y + h / 2}L${x + w - i},${y + h}H${x + i}L${x},${y + h / 2}Z" ${base} ${a}/>`;
                }
                case 'diamond':
                    return `<path d="M${x + w / 2},${y}L${x + w},${y + h / 2}L${x + w / 2},${y + h}L${x},${y + h / 2}Z" ${base} ${a}/>`;
                case 'circle':
                    return `<ellipse cx="${x + w / 2}" cy="${y + h / 2}" rx="${w / 2}" ry="${h / 2}" ${base} ${a}/>`;
                case 'note': {
                    const f = 18;
                    return `<path d="M${x},${y}H${x + w - f}L${x + w},${y + f}V${y + h}H${x}Z" ${base} ${a}/>` +
                        `<path d="M${x + w - f},${y}V${y + f}H${x + w}" fill="none" stroke="${p.stroke}" stroke-width="1.5"/>`;
                }
                default: return `<path d="${rr(x, y, w, h, 8)}" ${base} ${a}/>`;
            }
        }

        const CENTERED = new Set(['circle', 'diamond', 'hex', 'pill']);

        const _meas = document.createElement('canvas').getContext('2d');
        function textW(s, fs, weight) {
            _meas.font = (weight || 400) + ' ' + fs + 'px ' + SANS;
            return _meas.measureText(s).width;
        }
        function fitText(s, px, fontPx, weight) {
            s = String(s == null ? '' : s);
            if (!s || textW(s, fontPx, weight) <= px) return s;
            let lo = 0, hi = s.length;
            while (lo < hi) {
                const mid = (lo + hi + 1) >> 1;
                if (textW(s.slice(0, mid) + '…', fontPx, weight) <= px) lo = mid; else hi = mid - 1;
            }
            return lo ? s.slice(0, lo) + '…' : '';
        }

        /* ============================================================
           Geometry — edges
           ============================================================ */
        function anchor(n, side) {
            const { x, y, w, h } = n;
            switch (side) {
                case 'n': return { x: x + w / 2, y: y, nx: 0, ny: -1 };
                case 's': return { x: x + w / 2, y: y + h, nx: 0, ny: 1 };
                case 'w': return { x: x, y: y + h / 2, nx: -1, ny: 0 };
                default: return { x: x + w, y: y + h / 2, nx: 1, ny: 0 };
            }
        }

        function autoSide(a, b) {
            const dx = (b.x + b.w / 2) - (a.x + a.w / 2);
            const dy = (b.y + b.h / 2) - (a.y + a.h / 2);
            if (Math.abs(dx) >= Math.abs(dy)) return dx >= 0 ? 'e' : 'w';
            return dy >= 0 ? 's' : 'n';
        }
        const opposite = s => ({ n: 's', s: 'n', e: 'w', w: 'e' }[s]);

        function polyD(pts, r) {
            if (pts.length < 2) return '';
            let d = `M${pts[0].x},${pts[0].y}`;
            for (let i = 1; i < pts.length - 1; i++) {
                const p = pts[i], a = pts[i - 1], b = pts[i + 1];
                const l1 = Math.hypot(p.x - a.x, p.y - a.y), l2 = Math.hypot(b.x - p.x, b.y - p.y);
                const rr2 = Math.min(r, l1 / 2, l2 / 2);
                if (rr2 < 1) { d += `L${p.x},${p.y}`; continue; }
                const u1 = { x: (p.x - a.x) / (l1 || 1), y: (p.y - a.y) / (l1 || 1) };
                const u2 = { x: (b.x - p.x) / (l2 || 1), y: (b.y - p.y) / (l2 || 1) };
                d += `L${p.x - u1.x * rr2},${p.y - u1.y * rr2}Q${p.x},${p.y} ${p.x + u2.x * rr2},${p.y + u2.y * rr2}`;
            }
            const e = pts[pts.length - 1];
            d += `L${e.x},${e.y}`;
            return d;
        }

        function polyMid(pts) {
            let total = 0; const segs = [];
            for (let i = 1; i < pts.length; i++) { const l = Math.hypot(pts[i].x - pts[i - 1].x, pts[i].y - pts[i - 1].y); segs.push(l); total += l; }
            let want = total / 2;
            for (let i = 0; i < segs.length; i++) {
                if (want <= segs[i] || i === segs.length - 1) {
                    const t = segs[i] ? want / segs[i] : 0;
                    return { x: pts[i].x + (pts[i + 1].x - pts[i].x) * t, y: pts[i].y + (pts[i + 1].y - pts[i].y) * t };
                }
                want -= segs[i];
            }
            return pts[0];
        }

        function selfLoop(n) {
            const x = n.x + n.w, y = n.y + n.h * 0.3, x2 = n.x + n.w * 0.7, y2 = n.y;
            const d = `M${x},${y}C${x + 62},${y - 26} ${x2 + 40},${y2 - 54} ${x2},${y2 - 2}`;
            return { d, mid: { x: x + 34, y: y2 - 34 }, endDir: { x: -0.6, y: 0.8 }, end: { x: x2, y: y2 - 2 }, start: { x, y }, startDir: { x: 1, y: -0.4 } };
        }

        function edgeGeom(e) {
            const A = nodeById(e.from), B = nodeById(e.to);
            if (!A || !B) return null;
            if (A === B) return selfLoop(A);

            let sa = e.fromSide && e.fromSide !== 'auto' ? e.fromSide : autoSide(A, B);
            let sb = e.toSide && e.toSide !== 'auto' ? e.toSide : autoSide(B, A);
            const pa = anchor(A, sa), pb = anchor(B, sb);
            const gap = 2;
            const s = { x: pa.x + pa.nx * gap, y: pa.y + pa.ny * gap };
            const t = { x: pb.x + pb.nx * gap, y: pb.y + pb.ny * gap };

            if (e.route === 'straight') {
                const dx = t.x - s.x, dy = t.y - s.y, L = Math.hypot(dx, dy) || 1;
                return { d: `M${s.x},${s.y}L${t.x},${t.y}`, mid: { x: (s.x + t.x) / 2, y: (s.y + t.y) / 2 }, end: t, start: s, endDir: { x: dx / L, y: dy / L }, startDir: { x: -dx / L, y: -dy / L } };
            }

            if (e.route === 'curve') {
                const dist = clamp(Math.hypot(t.x - s.x, t.y - s.y) * 0.42, 34, 150);
                const c1 = { x: s.x + pa.nx * dist, y: s.y + pa.ny * dist };
                const c2 = { x: t.x + pb.nx * dist, y: t.y + pb.ny * dist };
                const bp = (a, b, c, d, u) => {
                    const m = 1 - u;
                    return { x: m * m * m * a.x + 3 * m * m * u * b.x + 3 * m * u * u * c.x + u * u * u * d.x, y: m * m * m * a.y + 3 * m * m * u * b.y + 3 * m * u * u * c.y + u * u * u * d.y };
                };
                const near = bp(s, c1, c2, t, 0.96);
                const L = Math.hypot(t.x - near.x, t.y - near.y) || 1;
                const nearS = bp(s, c1, c2, t, 0.04);
                const LS = Math.hypot(s.x - nearS.x, s.y - nearS.y) || 1;
                return {
                    d: `M${s.x},${s.y}C${c1.x},${c1.y} ${c2.x},${c2.y} ${t.x},${t.y}`,
                    mid: bp(s, c1, c2, t, 0.5), end: t, start: s,
                    endDir: { x: (t.x - near.x) / L, y: (t.y - near.y) / L },
                    startDir: { x: (s.x - nearS.x) / LS, y: (s.y - nearS.y) / LS }
                };
            }

            /* orthogonal */
            const ext = 22;
            const s1 = { x: s.x + pa.nx * ext, y: s.y + pa.ny * ext };
            const t1 = { x: t.x + pb.nx * ext, y: t.y + pb.ny * ext };
            const hA = pa.nx !== 0, hB = pb.nx !== 0;
            const pts = [s, s1];
            if (hA && hB) {
                const mx = (s1.x + t1.x) / 2;
                if (Math.abs(s1.y - t1.y) < 1) { /* straight across */ }
                else { pts.push({ x: mx, y: s1.y }, { x: mx, y: t1.y }); }
            } else if (!hA && !hB) {
                const my = (s1.y + t1.y) / 2;
                if (Math.abs(s1.x - t1.x) > 1) pts.push({ x: s1.x, y: my }, { x: t1.x, y: my });
            } else if (hA) {
                pts.push({ x: t1.x, y: s1.y });
            } else {
                pts.push({ x: s1.x, y: t1.y });
            }
            pts.push(t1, t);
            const clean = pts.filter((p, i) => i === 0 || Math.abs(p.x - pts[i - 1].x) > 0.5 || Math.abs(p.y - pts[i - 1].y) > 0.5);
            const last = clean[clean.length - 1], prev = clean[clean.length - 2] || last;
            const L = Math.hypot(last.x - prev.x, last.y - prev.y) || 1;
            const f0 = clean[0], f1 = clean[1] || f0;
            const L0 = Math.hypot(f1.x - f0.x, f1.y - f0.y) || 1;
            return {
                d: polyD(clean, 10), mid: polyMid(clean), end: last, start: f0,
                endDir: { x: (last.x - prev.x) / L, y: (last.y - prev.y) / L },
                startDir: { x: (f0.x - f1.x) / L0, y: (f0.y - f1.y) / L0 }
            };
        }

        function arrowHead(p, dir, color) {
            const n = { x: -dir.y, y: dir.x }, len = 10, wd = 4.6;
            const b = { x: p.x - dir.x * len, y: p.y - dir.y * len };
            return `<path d="M${p.x},${p.y}L${b.x + n.x * wd},${b.y + n.y * wd}L${b.x - n.x * wd},${b.y - n.y * wd}Z" fill="${color}" stroke="none"/>`;
        }

        /* ============================================================
           Rendering
           ============================================================ */
        const cv = $('#cv');

        function renderNode(n) {
            const p = nodePaint(n);
            const out = [];
            out.push(`<g data-node="${n.id}" style="cursor:move">`);
            out.push(shapeMarkup(n, p));

            const hasIcon = !!(n.icon && ICONS[n.icon]);
            const cx = n.x + n.w / 2, cy = n.y + n.h / 2;

            if (n.shape === 'group') {
                out.push(`<text x="${n.x + 13}" y="${n.y + 20}" font-family="${SANS}" font-size="12" font-weight="700" fill="${p.acc}" letter-spacing=".04em">${esc(fitText((n.label || '').toUpperCase(), n.w - 26, 12, 700))}</text>`);
                if (n.sub) out.push(`<text x="${n.x + 13}" y="${n.y + 36}" font-family="${SANS}" font-size="11" fill="${p.muted}">${esc(fitText(n.sub, n.w - 26, 11))}</text>`);
                out.push(`</g>`);
                return out.join('');
            }

            const centered = CENTERED.has(n.shape) || !hasIcon;
            const yShift = n.shape === 'cyl' ? Math.min(15, n.h * 0.22) * 0.5 : 0;

            if (centered) {
                let ty = cy + yShift;
                if (hasIcon) {
                    out.push(`<g transform="translate(${cx - 10},${ty - (n.sub ? 30 : 24)}) scale(1.25)" fill="${p.acc}">${ICONS[n.icon]}</g>`);
                    ty += 8;
                }
                const availW = n.shape === 'diamond' ? n.w * 0.62 : n.w - 20;
                out.push(`<text x="${cx}" y="${ty + (n.sub ? -1 : 5)}" text-anchor="middle" font-family="${SANS}" font-size="13" font-weight="600" fill="${p.ink}">${esc(fitText(n.label, availW, 13, 600))}</text>`);
                if (n.sub) out.push(`<text x="${cx}" y="${ty + 15}" text-anchor="middle" font-family="${SANS}" font-size="11" fill="${p.muted}">${esc(fitText(n.sub, availW, 11))}</text>`);
            } else {
                const ix = n.x + 14, iy = cy - 10 + yShift;
                out.push(`<g transform="translate(${ix},${iy}) scale(1.25)" fill="${p.acc}">${ICONS[n.icon]}</g>`);
                const tx = n.x + 46, availW = n.w - 58 - (n.shape === 'queue' ? 26 : 0);
                const by = cy + yShift;
                out.push(`<text x="${tx}" y="${by + (n.sub ? -1 : 5)}" font-family="${SANS}" font-size="13" font-weight="600" fill="${p.ink}">${esc(fitText(n.label, availW, 13, 600))}</text>`);
                if (n.sub) out.push(`<text x="${tx}" y="${by + 15}" font-family="${SANS}" font-size="11" fill="${p.muted}">${esc(fitText(n.sub, availW, 11))}</text>`);
            }
            out.push(`</g>`);
            return out.join('');
        }

        function renderEdge(e) {
            const g = edgeGeom(e);
            if (!g) return { main: '', hit: '' };
            const T = theme();
            const isSel = sel.has(e.id);
            const col = isSel ? T.sel : (e.color ? (C[e.color] || e.color) : T.edge);
            const dash = e.line === 'dashed' ? ' stroke-dasharray="8 5"' : e.line === 'dotted' ? ' stroke-dasharray="1.5 4.5" stroke-linecap="round"' : '';
            const w = isSel ? 2.4 : 1.7;
            let s = `<path d="${g.d}" fill="none" stroke="${col}" stroke-width="${w}"${dash} stroke-linejoin="round"/>`;
            if (e.arrows !== 'none') s += arrowHead(g.end, g.endDir, col);
            if (e.arrows === 'both') s += arrowHead(g.start, g.startDir, col);
            if (e.label) {
                const fs = 11, tw = textW(e.label, fs) + 13;
                s += `<rect x="${g.mid.x - tw / 2}" y="${g.mid.y - 9}" width="${tw}" height="18" rx="4" fill="${T.bg}" stroke="${mix(col, T.bg, 0.72)}" stroke-width="1"/>` +
                    `<text x="${g.mid.x}" y="${g.mid.y + 4}" text-anchor="middle" font-family="${SANS}" font-size="${fs}" fill="${isSel ? T.sel : T.muted}">${esc(e.label)}</text>`;
            }
            return { main: s, hit: `<path class="hit" data-edge="${e.id}" d="${g.d}" fill="none" stroke="transparent" stroke-width="16" style="cursor:pointer"/>` };
        }

        function renderUI() {
            const T = theme();
            let s = '';
            const selN = selNodes();

            /* selection outlines */
            selN.forEach(n => {
                s += `<rect x="${n.x - 5}" y="${n.y - 5}" width="${n.w + 10}" height="${n.h + 10}" rx="8" fill="none" stroke="${T.sel}" stroke-width="1.2" stroke-dasharray="4 3"/>`;
            });

            /* resize handles for single node */
            if (selN.length === 1 && !drag) {
                const n = selN[0];
                [['nw', n.x, n.y], ['ne', n.x + n.w, n.y], ['se', n.x + n.w, n.y + n.h], ['sw', n.x, n.y + n.h]].forEach(([k, x, y]) => {
                    s += `<rect data-resize="${k}" data-rnode="${n.id}" x="${x - 4}" y="${y - 4}" width="8" height="8" fill="${T.bg}" stroke="${T.sel}" stroke-width="1.5" style="pointer-events:all;cursor:${k === 'nw' || k === 'se' ? 'nwse' : 'nesw'}-resize"/>`;
                });
            }

            /* ports on hovered / single-selected node */
            const portNode = nodeById(hoverId) || (selN.length === 1 ? selN[0] : null);
            if (portNode && (!drag || drag.mode === 'link')) {
                ['n', 'e', 's', 'w'].forEach(side => {
                    const a = anchor(portNode, side);
                    s += `<circle data-port="${side}" data-pnode="${portNode.id}" cx="${a.x}" cy="${a.y}" r="5" fill="${T.bg}" stroke="${T.sel}" stroke-width="1.6" style="pointer-events:all;cursor:crosshair"/>`;
                });
            }

            /* live link */
            if (drag && drag.mode === 'link' && drag.cur) {
                const a = anchor(nodeById(drag.node), drag.side);
                s += `<path d="M${a.x},${a.y}L${drag.cur.x},${drag.cur.y}" stroke="${T.sel}" stroke-width="1.8" stroke-dasharray="5 4" fill="none"/>` +
                    `<circle cx="${drag.cur.x}" cy="${drag.cur.y}" r="3.5" fill="${T.sel}"/>`;
                if (drag.over) {
                    const t = nodeById(drag.over);
                    if (t) s += `<rect x="${t.x - 4}" y="${t.y - 4}" width="${t.w + 8}" height="${t.h + 8}" rx="8" fill="none" stroke="${T.sel}" stroke-width="2"/>`;
                }
            }

            /* marquee */
            if (drag && drag.mode === 'marquee' && drag.cur) {
                const x = Math.min(drag.start.x, drag.cur.x), y = Math.min(drag.start.y, drag.cur.y);
                const w = Math.abs(drag.cur.x - drag.start.x), h = Math.abs(drag.cur.y - drag.start.y);
                s += `<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${T.sel}" fill-opacity=".08" stroke="${T.sel}" stroke-width="1" stroke-dasharray="4 3"/>`;
            }
            return s;
        }

        function render() {
            const T = theme();
            const groups = state.nodes.filter(n => n.shape === 'group');
            const nodes = state.nodes.filter(n => n.shape !== 'group');
            const edgeParts = state.edges.map(renderEdge);

            const gridSize = 20 * view.k;
            const gridMarkup = state.grid ? `<rect x="0" y="0" width="100%" height="100%" fill="url(#gridp)"/>` : '';

            cv.innerHTML =
                `<defs>
                    <pattern id="gridp" width="${gridSize}" height="${gridSize}" patternUnits="userSpaceOnUse" patternTransform="translate(${view.x % gridSize},${view.y % gridSize})">
                        <circle cx="0.5" cy="0.5" r="1" fill="${T.grid}"/>
                    </pattern>
                </defs>
                <rect x="0" y="0" width="100%" height="100%" fill="${T.bg}"/>
                ${gridMarkup}
                <g id="scene" transform="translate(${view.x},${view.y}) scale(${view.k})">
                    <g id="l-groups">${groups.map(renderNode).join('')}</g>
                    <g id="l-edges">${edgeParts.map(p => p.main).join('')}</g>
                    <g id="l-ehit">${edgeParts.map(p => p.hit).join('')}</g>
                    <g id="l-nodes">${nodes.map(renderNode).join('')}</g>
                    <g id="l-ui" style="pointer-events:none">${renderUI()}</g>
                </g>`;

            $('#zoomLbl').textContent = Math.round(view.k * 100) + '%';
            $('#bUndo').disabled = !past.length;
            $('#bRedo').disabled = !future.length;
            $('#hint').style.display = state.nodes.length ? 'none' : '';
        }

        /* ============================================================
           View helpers
           ============================================================ */
        function toWorld(cx, cy) {
            const r = cv.getBoundingClientRect();
            return { x: (cx - r.left - view.x) / view.k, y: (cy - r.top - view.y) / view.k };
        }
        function zoomAt(cx, cy, k2) {
            const r = cv.getBoundingClientRect();
            const px = cx - r.left, py = cy - r.top;
            const wx = (px - view.x) / view.k, wy = (py - view.y) / view.k;
            view.k = clamp(k2, 0.15, 4);
            view.x = px - wx * view.k; view.y = py - wy * view.k;
            render();
        }
        function zoomBy(f) { const r = cv.getBoundingClientRect(); zoomAt(r.left + r.width / 2, r.top + r.height / 2, view.k * f); }

        function contentBox(pad) {
            pad = pad == null ? 48 : pad;
            if (!state.nodes.length) return { x: -200, y: -150, w: 400, h: 300 };
            let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
            state.nodes.forEach(n => { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); });
            return { x: x1 - pad, y: y1 - pad, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2 };
        }

        function fit() {
            const r = cv.getBoundingClientRect(), b = contentBox();
            view.k = clamp(Math.min(r.width / b.w, r.height / b.h), 0.15, 1.6);
            view.x = (r.width - b.w * view.k) / 2 - b.x * view.k;
            view.y = (r.height - b.h * view.k) / 2 - b.y * view.k;
            render();
        }

        const snapv = v => state.snap ? Math.round(v / GRID) * GRID : Math.round(v);

        /* ============================================================
           Node / edge creation
           ============================================================ */
        function makeNode(def, x, y) {
            const w = def.w || (def.s === 'group' ? 340 : DEF_W);
            const h = def.h || (def.s === 'group' ? 220 : DEF_H);
            return {
                id: uid('n'), x: snapv(x - w / 2), y: snapv(y - h / 2), w, h,
                label: def.t, sub: '', icon: def.i || '', shape: def.s || 'rect', color: def.c || 'slate'
            };
        }

        function addNode(def, x, y, silent) {
            if (!silent) mark();
            const n = makeNode(def, x, y);
            state.nodes.push(n);
            lastType = def;
            sel.clear(); sel.add(n.id);
            render(); inspect(); save();
            return n;
        }

        function addEdge(from, to, fromSide, toSide) {
            if (state.edges.some(e => e.from === from && e.to === to && e.fromSide === fromSide)) return null;
            const e = { id: uid('e'), from, to, fromSide: fromSide || 'auto', toSide: toSide || 'auto', label: '', route: 'ortho', line: 'solid', arrows: 'end', color: null };
            state.edges.push(e);
            return e;
        }

        function deleteSelection() {
            if (!sel.size) return;
            mark();
            const ids = new Set(sel);
            /* deleting a group deletes only the group frame */
            state.nodes = state.nodes.filter(n => !ids.has(n.id));
            state.edges = state.edges.filter(e => !ids.has(e.id) && !ids.has(e.from) && !ids.has(e.to));
            sel.clear();
            render(); inspect(); save();
        }

        function duplicateSelection() {
            const ns = selNodes();
            if (!ns.length) return;
            mark();
            const map = {};
            const copies = ns.map(n => { const c = clone(n); c.id = uid('n'); c.x += 24; c.y += 24; map[n.id] = c.id; return c; });
            state.nodes.push(...copies);
            state.edges.filter(e => map[e.from] && map[e.to]).forEach(e => {
                const c = clone(e); c.id = uid('e'); c.from = map[e.from]; c.to = map[e.to]; state.edges.push(c);
            });
            sel = new Set(copies.map(c => c.id));
            render(); inspect(); save();
        }

        function groupSelection() {
            const ns = selNodes().filter(n => n.shape !== 'group');
            if (!ns.length) return;
            mark();
            const pad = 34;
            let x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
            ns.forEach(n => { x1 = Math.min(x1, n.x); y1 = Math.min(y1, n.y); x2 = Math.max(x2, n.x + n.w); y2 = Math.max(y2, n.y + n.h); });
            const g = {
                id: uid('n'), x: x1 - pad, y: y1 - pad - 14, w: (x2 - x1) + pad * 2, h: (y2 - y1) + pad * 2 + 14,
                label: 'Zone', sub: '', icon: '', shape: 'group', color: 'slate'
            };
            state.nodes.unshift(g);
            sel = new Set([g.id]);
            render(); inspect(); save();
        }

        function childrenOf(g) {
            return state.nodes.filter(n => n !== g && n.shape !== 'group' &&
                n.x + n.w / 2 > g.x && n.x + n.w / 2 < g.x + g.w &&
                n.y + n.h / 2 > g.y && n.y + n.h / 2 < g.y + g.h);
        }

        /* ============================================================
           Interaction
           ============================================================ */
        function nodeAt(w) {
            for (let i = state.nodes.length - 1; i >= 0; i--) {
                const n = state.nodes[i];
                if (n.shape === 'group') continue;
                if (w.x >= n.x && w.x <= n.x + n.w && w.y >= n.y && w.y <= n.y + n.h) return n;
            }
            for (let i = state.nodes.length - 1; i >= 0; i--) {
                const n = state.nodes[i];
                if (n.shape === 'group' && w.x >= n.x && w.x <= n.x + n.w && w.y >= n.y && w.y <= n.y + n.h) return n;
            }
            return null;
        }

        cv.addEventListener('pointerdown', ev => {
            if (ev.button === 2) return;
            hideEditor();
            try { cv.setPointerCapture(ev.pointerId); } catch (err) { }
            const w = toWorld(ev.clientX, ev.clientY);
            const t = ev.target;

            /* pan */
            if (ev.button === 1 || spaceDown || tool === 'pan') {
                drag = { mode: 'pan', sx: ev.clientX, sy: ev.clientY, vx: view.x, vy: view.y };
                cv.classList.add('panning');
                return;
            }

            /* resize handle */
            const rh = t.closest && t.closest('[data-resize]');
            if (rh) {
                const n = nodeById(rh.getAttribute('data-rnode'));
                mark();
                drag = { mode: 'resize', node: n.id, k: rh.getAttribute('data-resize'), o: { x: n.x, y: n.y, w: n.w, h: n.h }, start: w, moved: false };
                return;
            }

            /* port → link */
            const ph = t.closest && t.closest('[data-port]');
            if (ph) {
                drag = { mode: 'link', node: ph.getAttribute('data-pnode'), side: ph.getAttribute('data-port'), cur: w, over: null };
                render();
                return;
            }

            /* node */
            const nEl = t.closest && t.closest('[data-node]');
            if (nEl) {
                const id = nEl.getAttribute('data-node');
                if (ev.shiftKey) { sel.has(id) ? sel.delete(id) : sel.add(id); }
                else if (!sel.has(id)) { sel.clear(); sel.add(id); }
                const moving = selNodes();
                const extra = [];
                moving.filter(n => n.shape === 'group').forEach(g => childrenOf(g).forEach(c => { if (!sel.has(c.id) && !extra.includes(c)) extra.push(c); }));
                const all = [...moving, ...extra];
                drag = { mode: 'move', start: w, moved: false, items: all.map(n => ({ n, x: n.x, y: n.y })) };
                inspect(); render();
                return;
            }

            /* edge */
            const eEl = t.closest && t.closest('[data-edge]');
            if (eEl) {
                const id = eEl.getAttribute('data-edge');
                if (ev.shiftKey) { sel.has(id) ? sel.delete(id) : sel.add(id); } else { sel.clear(); sel.add(id); }
                drag = { mode: 'none' };
                inspect(); render();
                return;
            }

            /* empty → marquee */
            if (!ev.shiftKey) sel.clear();
            drag = { mode: 'marquee', start: w, cur: w, add: new Set(sel) };
            inspect(); render();
        });

        cv.addEventListener('pointermove', ev => {
            const w = toWorld(ev.clientX, ev.clientY);
            if (!drag) {
                const n = nodeAt(w);
                const id = n ? n.id : null;
                if (id !== hoverId) { hoverId = id; render(); }
                return;
            }
            if (drag.mode === 'pan') {
                view.x = drag.vx + (ev.clientX - drag.sx);
                view.y = drag.vy + (ev.clientY - drag.sy);
                render();
            } else if (drag.mode === 'move') {
                const dx = w.x - drag.start.x, dy = w.y - drag.start.y;
                if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
                    if (!drag.moved) { drag.moved = true; mark(); }
                    drag.items.forEach(it => { it.n.x = snapv(it.x + dx); it.n.y = snapv(it.y + dy); });
                    render();
                }
            } else if (drag.mode === 'resize') {
                const n = nodeById(drag.node), o = drag.o;
                const dx = w.x - drag.start.x, dy = w.y - drag.start.y;
                let x = o.x, y = o.y, ww = o.w, hh = o.h;
                if (drag.k.includes('e')) ww = o.w + dx;
                if (drag.k.includes('s')) hh = o.h + dy;
                if (drag.k.includes('w')) { x = o.x + dx; ww = o.w - dx; }
                if (drag.k.includes('n')) { y = o.y + dy; hh = o.h - dy; }
                if (ww < 40) { if (drag.k.includes('w')) x = o.x + o.w - 40; ww = 40; }
                if (hh < 34) { if (drag.k.includes('n')) y = o.y + o.h - 34; hh = 34; }
                n.x = snapv(x); n.y = snapv(y); n.w = snapv(ww); n.h = snapv(hh);
                render();
            } else if (drag.mode === 'link') {
                drag.cur = w;
                const t = nodeAt(w);
                drag.over = t && t.id !== drag.node ? t.id : null;
                render();
            } else if (drag.mode === 'marquee') {
                drag.cur = w;
                const x1 = Math.min(drag.start.x, w.x), x2 = Math.max(drag.start.x, w.x);
                const y1 = Math.min(drag.start.y, w.y), y2 = Math.max(drag.start.y, w.y);
                sel = new Set(drag.add);
                state.nodes.forEach(n => {
                    if (n.x + n.w > x1 && n.x < x2 && n.y + n.h > y1 && n.y < y2) sel.add(n.id);
                });
                render();
            }
        });

        function endDrag(ev) {
            if (!drag) return;
            const w = ev ? toWorld(ev.clientX, ev.clientY) : null;
            if (drag.mode === 'link' && w) {
                const t = nodeAt(w);
                if (t && t.id !== drag.node) {
                    mark();
                    addEdge(drag.node, t.id, drag.side, 'auto');
                    save();
                } else if (!t) {
                    mark();
                    const n = addNode(lastType, w.x, w.y, true);
                    addEdge(drag.node, n.id, drag.side, 'auto');
                    save();
                }
            }
            if (drag.mode === 'move' && drag.moved) save();
            if (drag.mode === 'resize') save();
            cv.classList.remove('panning');
            drag = null;
            render(); inspect();
        }
        cv.addEventListener('pointerup', endDrag);
        cv.addEventListener('pointercancel', () => { drag = null; cv.classList.remove('panning'); render(); });
        cv.addEventListener('contextmenu', e => e.preventDefault());

        cv.addEventListener('wheel', ev => {
            ev.preventDefault();
            if (ev.ctrlKey || ev.metaKey) {
                zoomAt(ev.clientX, ev.clientY, view.k * (ev.deltaY < 0 ? 1.1 : 1 / 1.1));
            } else {
                view.x -= ev.deltaX; view.y -= ev.deltaY; render();
            }
        }, { passive: false });

        cv.addEventListener('dblclick', ev => {
            const w = toWorld(ev.clientX, ev.clientY);
            const eEl = ev.target.closest && ev.target.closest('[data-edge]');
            const n = nodeAt(w);
            if (n) { sel.clear(); sel.add(n.id); render(); inspect(); showEditor(n); }
            else if (eEl) { sel.clear(); sel.add(eEl.getAttribute('data-edge')); render(); inspect(); $('#f-elabel') && $('#f-elabel').focus(); }
            else { addNode(lastType, w.x, w.y); showEditor(nodeById([...sel][0])); }
        });

        /* inline label editor */
        const editor = $('#editor');
        let editing = null;
        function showEditor(n) {
            if (!n) return;
            editing = n.id;
            editor.value = n.label || '';
            editor.style.display = 'block';
            editor.style.left = (view.x + n.x * view.k) + 'px';
            editor.style.top = (view.y + (n.shape === 'group' ? n.y + 4 : n.y + n.h / 2 - 13) * view.k) + 'px';
            editor.style.width = (n.w * view.k) + 'px';
            editor.style.fontSize = (13 * clamp(view.k, .6, 2)) + 'px';
            editor.focus(); editor.select();
        }
        function hideEditor(commit) {
            if (!editing) return;
            const n = nodeById(editing);
            if (n && commit !== false && editor.value !== n.label) { mark(); n.label = editor.value; save(); }
            editing = null;
            editor.style.display = 'none';
            render(); inspect();
        }
        editor.addEventListener('keydown', e => {
            e.stopPropagation();
            if (e.key === 'Enter') { e.preventDefault(); hideEditor(true); }
            if (e.key === 'Escape') { hideEditor(false); }
        });
        editor.addEventListener('blur', () => hideEditor(true));

        /* ============================================================
           Keyboard
           ============================================================ */
        document.addEventListener('keydown', e => {
            const tag = (e.target.tagName || '').toLowerCase();
            const typing = tag === 'input' || tag === 'textarea' || tag === 'select';
            const meta = e.metaKey || e.ctrlKey;

            if (e.code === 'Space' && !typing) { spaceDown = true; cv.classList.add('panmode'); e.preventDefault(); }
            if (typing) {
                if (e.key === 'Escape') e.target.blur();
                return;
            }
            if (meta && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
            if (meta && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); return; }
            if (meta && e.key.toLowerCase() === 'a') { e.preventDefault(); sel = new Set(state.nodes.map(n => n.id)); render(); inspect(); return; }
            if (meta && e.key.toLowerCase() === 'd') { e.preventDefault(); duplicateSelection(); return; }
            if (meta && e.key.toLowerCase() === 's') { e.preventDefault(); exportJSON(); return; }
            if (meta && e.key.toLowerCase() === 'g') { e.preventDefault(); groupSelection(); return; }
            if (meta) return;

            switch (e.key) {
                case 'Backspace': case 'Delete': e.preventDefault(); deleteSelection(); break;
                case 'Escape': sel.clear(); render(); inspect(); break;
                case 'v': case 'V': setTool('select'); break;
                case 'h': case 'H': setTool('pan'); break;
                case 'f': case 'F': fit(); break;
                case '+': case '=': zoomBy(1.2); break;
                case '-': case '_': zoomBy(1 / 1.2); break;
                case '0': view = { x: 0, y: 0, k: 1 }; fit(); break;
                case '?': openHelp(); break;
                case 'Enter': { const n = selNodes()[0]; if (n) showEditor(n); break; }
                case 'ArrowUp': case 'ArrowDown': case 'ArrowLeft': case 'ArrowRight': {
                    const ns = selNodes(); if (!ns.length) return;
                    e.preventDefault();
                    const d = e.shiftKey ? GRID * 5 : GRID;
                    const dx = e.key === 'ArrowLeft' ? -d : e.key === 'ArrowRight' ? d : 0;
                    const dy = e.key === 'ArrowUp' ? -d : e.key === 'ArrowDown' ? d : 0;
                    mark(); ns.forEach(n => { n.x += dx; n.y += dy; }); render(); save();
                    break;
                }
            }
        });
        document.addEventListener('keyup', e => {
            if (e.code === 'Space') { spaceDown = false; cv.classList.remove('panmode'); }
        });

        function setTool(t) {
            tool = t;
            $('#bSelect').classList.toggle('on', t === 'select');
            $('#bPan').classList.toggle('on', t === 'pan');
            cv.classList.toggle('panmode', t === 'pan');
        }

        /* ============================================================
           Palette
           ============================================================ */
        function buildPalette(filter) {
            const q = (filter || '').trim().toLowerCase();
            let html = '';
            PALETTE.forEach((cat, ci) => {
                const items = cat.items.filter(it => !q || it.t.toLowerCase().includes(q) || cat.cat.toLowerCase().includes(q));
                if (!items.length) return;
                html += `<div class="cat">${esc(cat.cat)}</div>`;
                items.forEach(it => {
                    const idx = cat.items.indexOf(it);
                    const col = C[it.c] || C.slate;
                    html += `<div class="pitem" data-cat="${ci}" data-idx="${idx}" title="${esc(it.t)}">` +
                        `<span style="color:${col};display:flex">${it.i ? icon(it.i, 15) : `<svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><rect x="1.5" y="4" width="13" height="8" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>`}</span>` +
                        `<span>${esc(it.t)}</span></div>`;
                });
            });
            $('#palette').innerHTML = html || `<div class="cat">no match</div>`;
        }

        $('#palSearch').addEventListener('input', e => buildPalette(e.target.value));

        const ghost = $('#ghost');
        let palDrag = null;

        $('#palette').addEventListener('pointerdown', ev => {
            const it = ev.target.closest('.pitem');
            if (!it) return;
            ev.preventDefault();
            const def = PALETTE[+it.dataset.cat].items[+it.dataset.idx];
            palDrag = { def, sx: ev.clientX, sy: ev.clientY, active: false };
            const col = C[def.c] || C.slate;
            ghost.innerHTML = `<span style="color:${col};display:flex">${def.i ? icon(def.i, 15) : ''}</span>${esc(def.t)}`;
            document.addEventListener('pointermove', palMove);
            document.addEventListener('pointerup', palUp);
        });

        function palMove(ev) {
            if (!palDrag) return;
            if (!palDrag.active && Math.hypot(ev.clientX - palDrag.sx, ev.clientY - palDrag.sy) > 4) {
                palDrag.active = true; ghost.style.display = 'flex';
            }
            if (palDrag.active) { ghost.style.left = (ev.clientX + 12) + 'px'; ghost.style.top = (ev.clientY + 10) + 'px'; }
        }

        function palUp(ev) {
            document.removeEventListener('pointermove', palMove);
            document.removeEventListener('pointerup', palUp);
            ghost.style.display = 'none';
            if (!palDrag) return;
            const r = cv.getBoundingClientRect();
            const inside = ev.clientX >= r.left && ev.clientX <= r.right && ev.clientY >= r.top && ev.clientY <= r.bottom;
            if (palDrag.active && inside) {
                const w = toWorld(ev.clientX, ev.clientY);
                addNode(palDrag.def, w.x, w.y);
            } else if (!palDrag.active) {
                const c = toWorld(r.left + r.width / 2, r.top + r.height / 2);
                addNode(palDrag.def, c.x, c.y);
            }
            palDrag = null;
        }

        /* ============================================================
           Inspector
           ============================================================ */
        function seg(id, val, opts) {
            return `<div class="seg" id="${id}">` + opts.map(o =>
                `<button data-v="${o[0]}" class="${val === o[0] ? 'on' : ''}" title="${esc(o[2] || o[1])}">${o[1]}</button>`).join('') + `</div>`;
        }

        function swatches(cur) {
            return `<div class="swatches">` + COLORS.map(c =>
                `<button class="sw ${cur === c.k ? 'on' : ''}" data-c="${c.k}" style="background:${c.v}" title="${c.k}"></button>`).join('') + `</div>`;
        }

        function inspect() {
            const insp = $('#inspector'), ttl = $('#inspTitle');
            const ns = selNodes(), es = selEdges();

            if (ns.length === 1 && es.length === 0) {
                const n = ns[0];
                ttl.textContent = n.shape === 'group' ? 'Zone' : 'Node';
                insp.innerHTML = `
                    <div class="sec">
                        <label class="fld"><span class="lbl">Label</span><input class="txt" id="f-label" value="${esc(n.label)}"></label>
                        <label class="fld"><span class="lbl">Subtitle</span><input class="txt" id="f-sub" value="${esc(n.sub || '')}" placeholder="tech, protocol, note…"></label>
                    </div>
                    <div class="sec">
                        <span class="lbl">Colour</span>${swatches(n.color)}
                    </div>
                    <div class="sec">
                        <span class="lbl">Shape</span>
                        <select class="txt" id="f-shape">${SHAPES.map(s => `<option value="${s[0]}" ${n.shape === s[0] ? 'selected' : ''}>${s[1]}</option>`).join('')}</select>
                    </div>
                    <div class="sec">
                        <span class="lbl">Icon</span>
                        <input class="txt" id="f-iconsearch" placeholder="filter icons…" style="margin-bottom:6px">
                        <div id="iconGrid"></div>
                    </div>
                    <div class="sec">
                        <span class="lbl">Size</span>
                        <div class="row">
                            <input class="txt" id="f-w" type="number" step="10" value="${Math.round(n.w)}">
                            <input class="txt" id="f-h" type="number" step="10" value="${Math.round(n.h)}">
                        </div>
                        <div class="row" style="margin-top:9px">
                            <button class="btn primary" id="b-front" style="flex:1">Bring front</button>
                            <button class="btn primary" id="b-back" style="flex:1">Send back</button>
                        </div>
                        <div class="row" style="margin-top:9px">
                            <button class="btn primary" id="b-dup" style="flex:1">Duplicate</button>
                            <button class="btn primary" id="b-del" style="flex:1">Delete</button>
                        </div>
                    </div>`;
                bindNodeFields([n]);
                buildIconGrid(n);
            } else if (ns.length === 0 && es.length === 1) {
                const e = es[0];
                ttl.textContent = 'Connection';
                const A = nodeById(e.from), B = nodeById(e.to);
                insp.innerHTML = `
                    <div class="sec">
                        <div class="stat">${esc((A && A.label) || '?')} → ${esc((B && B.label) || '?')}</div>
                    </div>
                    <div class="sec">
                        <label class="fld"><span class="lbl">Label</span><input class="txt" id="f-elabel" value="${esc(e.label || '')}" placeholder="HTTP POST /orders"></label>
                    </div>
                    <div class="sec">
                        <span class="lbl">Route</span>
                        ${seg('s-route', e.route, [['ortho', 'Orthogonal'], ['curve', 'Curved'], ['straight', 'Straight']])}
                        <div style="height:9px"></div>
                        <span class="lbl">Line</span>
                        ${seg('s-line', e.line, [['solid', 'Solid'], ['dashed', 'Dashed'], ['dotted', 'Dotted']])}
                        <div style="height:9px"></div>
                        <span class="lbl">Arrows</span>
                        ${seg('s-arrows', e.arrows, [['end', 'End'], ['both', 'Both'], ['none', 'None']])}
                    </div>
                    <div class="sec">
                        <span class="lbl">From side</span>
                        ${seg('s-fs', e.fromSide || 'auto', [['auto', 'Auto'], ['n', '↑'], ['e', '→'], ['s', '↓'], ['w', '←']])}
                        <div style="height:9px"></div>
                        <span class="lbl">To side</span>
                        ${seg('s-ts', e.toSide || 'auto', [['auto', 'Auto'], ['n', '↑'], ['e', '→'], ['s', '↓'], ['w', '←']])}
                    </div>
                    <div class="sec">
                        <span class="lbl">Colour</span>
                        <div class="swatches">
                            <button class="sw ${!e.color ? 'on' : ''}" data-c="" style="background:${theme().edge}" title="default"></button>
                            ${COLORS.map(c => `<button class="sw ${e.color === c.k ? 'on' : ''}" data-c="${c.k}" style="background:${c.v}"></button>`).join('')}
                        </div>
                        <div class="row" style="margin-top:11px">
                            <button class="btn primary" id="b-flip" style="flex:1">Reverse</button>
                            <button class="btn primary" id="b-del" style="flex:1">Delete</button>
                        </div>
                    </div>`;
                bindEdgeFields(e);
            } else if (ns.length + es.length > 1) {
                ttl.textContent = 'Selection';
                insp.innerHTML = `
                    <div class="sec"><div class="stat">${ns.length} node${ns.length === 1 ? '' : 's'} · ${es.length} connection${es.length === 1 ? '' : 's'}</div></div>
                    ${ns.length > 1 ? `<div class="sec">
                        <span class="lbl">Align</span>
                        <div class="row"><button class="btn primary al" data-a="l" style="flex:1">Left</button><button class="btn primary al" data-a="cx" style="flex:1">Center</button><button class="btn primary al" data-a="r" style="flex:1">Right</button></div>
                        <div class="row"><button class="btn primary al" data-a="t" style="flex:1">Top</button><button class="btn primary al" data-a="cy" style="flex:1">Middle</button><button class="btn primary al" data-a="b" style="flex:1">Bottom</button></div>
                        <div style="height:9px"></div>
                        <span class="lbl">Distribute</span>
                        <div class="row"><button class="btn primary al" data-a="dh" style="flex:1">Horizontally</button><button class="btn primary al" data-a="dv" style="flex:1">Vertically</button></div>
                        <div style="height:9px"></div>
                        <span class="lbl">Match size</span>
                        <div class="row"><button class="btn primary al" data-a="sw" style="flex:1">Width</button><button class="btn primary al" data-a="sh" style="flex:1">Height</button></div>
                    </div>` : ''}
                    ${ns.length ? `<div class="sec"><span class="lbl">Colour</span>${swatches(null)}</div>` : ''}
                    <div class="sec">
                        <div class="row">
                            <button class="btn primary" id="b-group" style="flex:1">Wrap in zone</button>
                            <button class="btn primary" id="b-dup" style="flex:1">Duplicate</button>
                        </div>
                        <div class="row" style="margin-top:9px"><button class="btn primary" id="b-del" style="flex:1">Delete selection</button></div>
                    </div>`;
                insp.querySelectorAll('.al').forEach(b => b.onclick = () => alignSel(b.dataset.a));
                insp.querySelectorAll('.sw').forEach(b => b.onclick = () => { mark(); selNodes().forEach(n => n.color = b.dataset.c); render(); save(); });
                const g = $('#b-group'); if (g) g.onclick = groupSelection;
                const d = $('#b-dup'); if (d) d.onclick = duplicateSelection;
                const x = $('#b-del'); if (x) x.onclick = deleteSelection;
            } else {
                ttl.textContent = 'Diagram';
                insp.innerHTML = `
                    <div class="sec">
                        <div class="stat">${state.nodes.filter(n => n.shape !== 'group').length} nodes · ${state.nodes.filter(n => n.shape === 'group').length} zones · ${state.edges.length} connections</div>
                    </div>
                    <div class="sec">
                        <span class="lbl">Export</span>
                        <div class="row"><button class="btn primary" id="x-svg" style="flex:1">SVG</button><button class="btn primary" id="x-png" style="flex:1">PNG</button><button class="btn primary" id="x-json" style="flex:1">JSON</button></div>
                    </div>
                    <div class="sec">
                        <span class="lbl">Getting started</span>
                        <div class="empty">
                            Drag a node from the palette onto the canvas.<br>
                            Hover a node and drag one of its <b>blue dots</b> to another node to connect them — drop on empty canvas to create the next node instantly.<br>
                            Double-click anything to rename.
                        </div>
                    </div>
                    <div class="sec">
                        <span class="lbl">Shortcuts</span>
                        <div class="kbdlist">
                            <div><kbd>V</kbd> / <kbd>H</kbd></div><div>select / pan</div>
                            <div><kbd>Space</kbd>-drag</div><div>pan canvas</div>
                            <div><kbd>⌘</kbd>-scroll</div><div>zoom</div>
                            <div><kbd>F</kbd></div><div>fit to content</div>
                            <div><kbd>⌘G</kbd></div><div>wrap in zone</div>
                            <div><kbd>⌘D</kbd></div><div>duplicate</div>
                            <div><kbd>⌫</kbd></div><div>delete</div>
                        </div>
                    </div>`;
                $('#x-svg').onclick = exportSVG;
                $('#x-png').onclick = exportPNG;
                $('#x-json').onclick = exportJSON;
            }
        }

        function bindNodeFields(ns) {
            const n = ns[0];
            const live = (id, key) => {
                const el = $(id); if (!el) return;
                let started = false;
                el.addEventListener('focus', () => { started = false; });
                el.addEventListener('input', () => {
                    if (!started) { mark(); started = true; }
                    n[key] = el.value; render(); save();
                });
            };
            live('#f-label', 'label'); live('#f-sub', 'sub');
            $('#f-shape').onchange = e => { mark(); n.shape = e.target.value; render(); save(); inspect(); };
            ['#f-w', '#f-h'].forEach((id, i) => {
                $(id).onchange = e => { mark(); n[i ? 'h' : 'w'] = Math.max(30, +e.target.value || 30); render(); save(); };
            });
            $('#inspector').querySelectorAll('.sw').forEach(b => b.onclick = () => { mark(); n.color = b.dataset.c; render(); save(); inspect(); });
            $('#b-front').onclick = () => { mark(); state.nodes = state.nodes.filter(x => x !== n).concat([n]); render(); save(); };
            $('#b-back').onclick = () => { mark(); state.nodes = [n].concat(state.nodes.filter(x => x !== n)); render(); save(); };
            $('#b-dup').onclick = duplicateSelection;
            $('#b-del').onclick = deleteSelection;
        }

        function buildIconGrid(n, filter) {
            const q = (filter || '').trim().toLowerCase();
            const names = ICON_NAMES.filter(x => !q || x.includes(q));
            $('#iconGrid').innerHTML =
                `<button data-i="" class="${!n.icon ? 'on' : ''}" title="no icon">—</button>` +
                names.map(x => `<button data-i="${x}" class="${n.icon === x ? 'on' : ''}" title="${x}">${icon(x, 15)}</button>`).join('');
            $('#iconGrid').querySelectorAll('button').forEach(b => b.onclick = () => {
                mark(); n.icon = b.dataset.i; render(); save();
                $('#iconGrid').querySelectorAll('button').forEach(o => o.classList.toggle('on', o === b));
            });
            const s = $('#f-iconsearch');
            if (s && !s._bound) { s._bound = 1; s.addEventListener('input', () => buildIconGrid(n, s.value)); }
        }

        function bindEdgeFields(e) {
            const el = $('#f-elabel');
            let started = false;
            el.addEventListener('input', () => { if (!started) { mark(); started = true; } e.label = el.value; render(); save(); });
            const bindSeg = (id, key) => {
                const box = $(id); if (!box) return;
                box.querySelectorAll('button').forEach(b => b.onclick = () => {
                    mark(); e[key] = b.dataset.v; render(); save();
                    box.querySelectorAll('button').forEach(o => o.classList.toggle('on', o === b));
                });
            };
            bindSeg('#s-route', 'route'); bindSeg('#s-line', 'line'); bindSeg('#s-arrows', 'arrows');
            bindSeg('#s-fs', 'fromSide'); bindSeg('#s-ts', 'toSide');
            $('#inspector').querySelectorAll('.sw').forEach(b => b.onclick = () => {
                mark(); e.color = b.dataset.c || null; render(); save(); inspect();
            });
            $('#b-flip').onclick = () => {
                mark();
                const f = e.from, fs = e.fromSide; e.from = e.to; e.fromSide = e.toSide; e.to = f; e.toSide = fs;
                render(); save(); inspect();
            };
            $('#b-del').onclick = deleteSelection;
        }

        function alignSel(a) {
            const ns = selNodes(); if (ns.length < 2) return;
            mark();
            const xs = ns.map(n => n.x), ys = ns.map(n => n.y);
            const x1 = Math.min(...xs), x2 = Math.max(...ns.map(n => n.x + n.w));
            const y1 = Math.min(...ys), y2 = Math.max(...ns.map(n => n.y + n.h));
            switch (a) {
                case 'l': ns.forEach(n => n.x = x1); break;
                case 'r': ns.forEach(n => n.x = x2 - n.w); break;
                case 'cx': { const c = (x1 + x2) / 2; ns.forEach(n => n.x = snapv(c - n.w / 2)); break; }
                case 't': ns.forEach(n => n.y = y1); break;
                case 'b': ns.forEach(n => n.y = y2 - n.h); break;
                case 'cy': { const c = (y1 + y2) / 2; ns.forEach(n => n.y = snapv(c - n.h / 2)); break; }
                case 'dh': {
                    const s = [...ns].sort((p, q) => p.x - q.x);
                    const total = x2 - x1, used = s.reduce((t, n) => t + n.w, 0);
                    const gap = (total - used) / (s.length - 1);
                    let cur = x1; s.forEach(n => { n.x = snapv(cur); cur += n.w + gap; });
                    break;
                }
                case 'dv': {
                    const s = [...ns].sort((p, q) => p.y - q.y);
                    const total = y2 - y1, used = s.reduce((t, n) => t + n.h, 0);
                    const gap = (total - used) / (s.length - 1);
                    let cur = y1; s.forEach(n => { n.y = snapv(cur); cur += n.h + gap; });
                    break;
                }
                case 'sw': { const w = Math.max(...ns.map(n => n.w)); ns.forEach(n => n.w = w); break; }
                case 'sh': { const h = Math.max(...ns.map(n => n.h)); ns.forEach(n => n.h = h); break; }
            }
            render(); save();
        }

        /* ============================================================
           Export
           ============================================================ */
        function download(name, blob) {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = name;
            document.body.appendChild(a); a.click();
            setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
        }
        const slug = () => (state.title || 'diagram').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'diagram';

        function buildSVG(transparent) {
            const T = theme(), b = contentBox(30);
            const savedSel = sel; sel = new Set();
            const groups = state.nodes.filter(n => n.shape === 'group').map(renderNode).join('');
            const nodes = state.nodes.filter(n => n.shape !== 'group').map(renderNode).join('');
            const edges = state.edges.map(e => renderEdge(e).main).join('');
            sel = savedSel;
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${Math.round(b.w)}" height="${Math.round(b.h)}" viewBox="${b.x} ${b.y} ${b.w} ${b.h}">` +
                `<style>text{font-family:${SANS}}</style>` +
                (transparent ? '' : `<rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}" fill="${T.bg}"/>`) +
                groups + edges + nodes + `</svg>`;
        }

        function exportSVG() {
            download(slug() + '.svg', new Blob([buildSVG(false)], { type: 'image/svg+xml' }));
        }

        function exportPNG(scale) {
            scale = scale || 2;
            const svg = buildSVG(false);
            const b = contentBox(30);
            const img = new Image();
            img.onload = () => {
                const c = document.createElement('canvas');
                c.width = Math.round(b.w * scale); c.height = Math.round(b.h * scale);
                const ctx = c.getContext('2d');
                ctx.fillStyle = theme().bg; ctx.fillRect(0, 0, c.width, c.height);
                ctx.drawImage(img, 0, 0, c.width, c.height);
                c.toBlob(bl => download(slug() + '.png', bl), 'image/png');
            };
            img.onerror = () => alert('PNG export failed — use SVG export instead.');
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svg)));
        }

        function exportJSON() {
            download(slug() + '.json', new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' }));
        }

        /* ============================================================
           Toolbar wiring
           ============================================================ */
        $('#bUndo').onclick = undo;
        $('#bRedo').onclick = redo;
        $('#bSelect').onclick = () => setTool('select');
        $('#bPan').onclick = () => setTool('pan');
        $('#bZoomIn').onclick = () => zoomBy(1.2);
        $('#bZoomOut').onclick = () => zoomBy(1 / 1.2);
        $('#bFit').onclick = fit;
        $('#bSnap').onclick = () => { state.snap = !state.snap; $('#bSnap').classList.toggle('on', state.snap); save(); };
        $('#bGrid').onclick = () => { state.grid = !state.grid; $('#bGrid').classList.toggle('on', state.grid); render(); save(); };
        $('#bTheme').onclick = () => {
            state.theme = state.theme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', state.theme);
            render(); inspect(); save();
        };
        $('#docTitle').addEventListener('input', e => { state.title = e.target.value; save(); });

        $('#bNew').onclick = () => {
            if (state.nodes.length && !confirm('Discard the current diagram and start over?')) return;
            mark();
            state.nodes = []; state.edges = []; state.title = 'Untitled diagram';
            $('#docTitle').value = state.title;
            sel.clear(); view = { x: 0, y: 0, k: 1 };
            render(); inspect(); save();
        };

        $('#bOpen').onclick = () => $('#fileIn').click();
        $('#fileIn').addEventListener('change', e => {
            const f = e.target.files[0]; if (!f) return;
            const r = new FileReader();
            r.onload = () => {
                try {
                    const d = JSON.parse(r.result);
                    if (!Array.isArray(d.nodes)) throw 0;
                    mark();
                    state.nodes = d.nodes; state.edges = d.edges || []; state.title = d.title || 'Untitled diagram';
                    if (d.theme) { state.theme = d.theme; document.documentElement.setAttribute('data-theme', state.theme); }
                    $('#docTitle').value = state.title;
                    sel.clear(); fit(); inspect(); save();
                } catch (err) { alert('That file is not a diagram JSON export.'); }
            };
            r.readAsText(f);
            e.target.value = '';
        });

        $('#bExport').onclick = () => {
            openModal(`<h2>Export</h2>
                <p>Everything renders locally — no network, no fonts, no tracking.</p>
                <div class="row" style="margin-top:14px">
                    <button class="btn primary" id="m-svg" style="flex:1;justify-content:center;padding:10px">SVG (vector)</button>
                    <button class="btn primary" id="m-png" style="flex:1;justify-content:center;padding:10px">PNG @2×</button>
                    <button class="btn primary" id="m-png4" style="flex:1;justify-content:center;padding:10px">PNG @4×</button>
                    <button class="btn primary" id="m-json" style="flex:1;justify-content:center;padding:10px">JSON (editable)</button>
                </div>`);
            $('#m-svg').onclick = () => { exportSVG(); closeModal(); };
            $('#m-png').onclick = () => { exportPNG(2); closeModal(); };
            $('#m-png4').onclick = () => { exportPNG(4); closeModal(); };
            $('#m-json').onclick = () => { exportJSON(); closeModal(); };
        };

        function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.add('open'); }
        function closeModal() { $('#modal').classList.remove('open'); }
        $('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });

        function openHelp() {
            openModal(`<h2>Architecture Diagram Tool</h2>
                <p>A single HTML file. Fully offline — no CDN, no fonts, no network calls. Your diagram autosaves to this browser's local storage.</p>
                <h3>Building</h3>
                <p>Drag from the palette onto the canvas, or click a palette item to drop it in the centre. Double-click empty canvas to repeat the last node type.</p>
                <p>Hover a node to reveal its four connection dots. Drag a dot onto another node to connect them. Drag a dot onto empty canvas to create the next node <em>and</em> the connection in one gesture.</p>
                <p>Double-click a node or connection to rename it inline. Everything else — icon, colour, shape, routing, arrowheads, line style — lives in the right panel.</p>
                <h3>Zones</h3>
                <p>Select several nodes and press <kbd>⌘G</kbd> to wrap them in a labelled zone (VPC, cluster, bounded context…). Moving a zone moves everything inside it.</p>
                <h3>Shortcuts</h3>
                <div class="kbdlist">
                    <div><kbd>V</kbd> / <kbd>H</kbd></div><div>select tool / pan tool</div>
                    <div><kbd>Space</kbd> + drag</div><div>pan the canvas</div>
                    <div><kbd>⌘</kbd> + scroll</div><div>zoom (plain scroll pans)</div>
                    <div><kbd>F</kbd></div><div>fit diagram to window</div>
                    <div><kbd>+</kbd> / <kbd>−</kbd> / <kbd>0</kbd></div><div>zoom in / out / reset</div>
                    <div><kbd>Enter</kbd></div><div>rename selected node</div>
                    <div><kbd>⌘A</kbd></div><div>select all</div>
                    <div><kbd>⌘D</kbd></div><div>duplicate selection</div>
                    <div><kbd>⌘G</kbd></div><div>wrap selection in a zone</div>
                    <div><kbd>⌘Z</kbd> / <kbd>⇧⌘Z</kbd></div><div>undo / redo</div>
                    <div><kbd>⌘S</kbd></div><div>download JSON</div>
                    <div><kbd>⌫</kbd></div><div>delete selection</div>
                    <div>arrows</div><div>nudge (<kbd>⇧</kbd> = ×5)</div>
                    <div><kbd>Esc</kbd></div><div>deselect</div>
                </div>
                <h3>Icons</h3>
                <p>${ICON_NAMES.length} Bootstrap Icons (MIT licensed) are embedded directly in this file and searchable from the node inspector.</p>`);
        }
        $('#bHelp').onclick = openHelp;

        /* ============================================================
           Sample diagram
           ============================================================ */
        function sample() {
            const N = (id, x, y, label, sub, i, c, s, w, h) => ({ id, x, y, w: w || DEF_W, h: h || DEF_H, label, sub: sub || '', icon: i || '', shape: s || 'rect', color: c || 'slate' });
            const nodes = [
                { id: 'z1', x: 300, y: 60, w: 620, h: 430, label: 'Order platform', sub: 'production VPC', icon: '', shape: 'group', color: 'slate' },
                N('u1', 60, 190, 'Customer', 'web + mobile', 'person', 'slate', 'circle', 100, 100),
                N('gw', 340, 110, 'API Gateway', 'REST · TLS', 'door-open', 'blue'),
                N('svc', 340, 240, 'Order Service', 'Java · Spring', 'box-seam', 'blue'),
                N('auth', 340, 370, 'Auth Service', 'OAuth2 / OIDC', 'shield-lock', 'red'),
                N('q', 600, 240, 'order.created', 'Kafka topic', 'broadcast-pin', 'amber', 'queue', 200),
                N('db', 600, 110, 'Order DB', 'PostgreSQL', 'database', 'green', 'cyl', 168, 70),
                N('bill', 740, 370, 'Billing Adapter', 'SAP · IDoc', 'plug', 'purple'),
                N('cron', 60, 400, 'Nightly Reconcile', 'cron 0 2 * * *', 'clock-history', 'teal'),
                N('file', 60, 520, 'SFTP Export', 'orders_*.csv', 'filetype-csv', 'green'),
                N('dlq', 600, 520, 'Dead Letter Queue', 'retry ×3', 'exclamation-triangle', 'red', 'queue', 200)
            ];
            const E = (from, to, label, o) => Object.assign({ id: uid('e'), from, to, fromSide: 'auto', toSide: 'auto', label: label || '', route: 'ortho', line: 'solid', arrows: 'end', color: null }, o || {});
            const edges = [
                E('u1', 'gw', 'HTTPS', { fromSide: 'e', toSide: 'w' }),
                E('gw', 'svc', 'POST /orders', { fromSide: 's', toSide: 'n' }),
                E('svc', 'auth', 'validate token', { fromSide: 's', toSide: 'n', line: 'dashed' }),
                E('svc', 'db', 'write', { fromSide: 'e', toSide: 's' }),
                E('svc', 'q', 'publish', { fromSide: 'e', toSide: 'w' }),
                E('q', 'bill', 'consume', { fromSide: 's', toSide: 'n', line: 'dashed' }),
                E('q', 'dlq', 'on failure', { fromSide: 's', toSide: 'n', line: 'dotted', color: 'red' }),
                E('cron', 'svc', 'trigger', { fromSide: 'e', toSide: 'w', line: 'dashed', color: 'teal' }),
                E('cron', 'file', 'writes', { fromSide: 's', toSide: 'n', color: 'teal' })
            ];
            return { title: 'Order processing — reference architecture', nodes, edges, theme: 'light', snap: true, grid: true };
        }

        /* ============================================================
           Boot
           ============================================================ */
        (function boot() {
            let loaded = null;
            try { const raw = localStorage.getItem(STORE); if (raw) loaded = JSON.parse(raw); } catch (e) { }
            state = (loaded && Array.isArray(loaded.nodes)) ? Object.assign(blank(), loaded) : sample();

            document.documentElement.setAttribute('data-theme', state.theme === 'dark' ? 'dark' : 'light');
            $('#docTitle').value = state.title;
            $('#bSnap').classList.toggle('on', !!state.snap);
            $('#bGrid').classList.toggle('on', !!state.grid);
            setTool('select');
            buildPalette('');
            render();
            fit();
            inspect();
            window.addEventListener('resize', () => render());
        })();
    </script>
</body>

</html>
