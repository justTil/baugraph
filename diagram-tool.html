<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Architecture Diagram Tool — Flows, Queues, Integrations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }

        :root {
            --ink: #111;
            --soft: #444;
            --muted: #777;
            --faint: #aaa;
            --line: #e2e2e2;
            --line2: #cfcfcf;
            --bg: #fff;
            --panel: #fbfbfb;
            --hover: #f2f2f2;
            --sel: #2f6fdb;
            --mono: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            --sans: Sora, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        html[data-theme="dark"] {
            --ink: #e8eaed;
            --soft: #c3c8ce;
            --muted: #939aa3;
            --faint: #6b7178;
            --line: #2a2f36;
            --line2: #3a414a;
            --bg: #0f1113;
            --panel: #14171a;
            --hover: #1d2126;
            --sel: #5b9dff;
        }

        html, body { height: 100%; }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            font-size: 13px;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        #app { height: 100%; display: flex; flex-direction: column; }

        /* ---------- top bar ---------- */
        header#top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 12px;
            height: 46px;
            border-bottom: 1px solid var(--line);
            background: var(--panel);
            flex: 0 0 auto;
        }

        .brand {
            font-weight: 700;
            font-size: 13px;
            letter-spacing: -.01em;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .brand svg { opacity: .8; }

        #docTitle {
            border: 1px solid transparent;
            background: transparent;
            color: var(--ink);
            font: inherit;
            font-weight: 500;
            padding: 5px 8px;
            border-radius: 5px;
            min-width: 120px;
            width: 240px;
        }

        #docTitle:hover { border-color: var(--line); }
        #docTitle:focus { outline: none; border-color: var(--line2); background: var(--bg); }

        .spacer { flex: 1 1 auto; }

        .grp { display: flex; align-items: center; gap: 2px; }

        .sep { width: 1px; height: 20px; background: var(--line); margin: 0 4px; }

        button.btn {
            appearance: none;
            border: 1px solid transparent;
            background: transparent;
            color: var(--soft);
            font: inherit;
            padding: 5px 8px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            white-space: nowrap;
        }

        button.btn:hover:not(:disabled) { background: var(--hover); color: var(--ink); }
        button.btn:disabled { opacity: .32; cursor: default; }
        button.btn.on { background: var(--ink); color: var(--bg); }
        button.btn.primary { border-color: var(--line2); }
        button.btn svg { display: block; }

        .zoomlbl {
            font-family: var(--mono);
            font-size: 11px;
            color: var(--muted);
            min-width: 44px;
            text-align: center;
            user-select: none;
        }

        /* ---------- layout ---------- */
        #main { flex: 1 1 auto; display: flex; min-height: 0; }

        aside {
            background: var(--panel);
            display: flex;
            flex-direction: column;
            min-height: 0;
            flex: 0 0 auto;
        }

        #left { width: 226px; border-right: 1px solid var(--line); }
        #right { width: 274px; border-left: 1px solid var(--line); }
        aside.hidden { display: none; }

        .panelhead {
            padding: 9px 12px;
            border-bottom: 1px solid var(--line);
            font-size: 10.5px;
            font-weight: 700;
            letter-spacing: .09em;
            text-transform: uppercase;
            color: var(--muted);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            flex: 0 0 auto;
        }

        .scroll { overflow-y: auto; overflow-x: hidden; flex: 1 1 auto; }
        .scroll::-webkit-scrollbar { width: 9px; }
        .scroll::-webkit-scrollbar-thumb { background: var(--line2); border-radius: 5px; border: 3px solid var(--panel); }
        .scroll::-webkit-scrollbar-track { background: transparent; }

        /* ---------- palette ---------- */
        .searchwrap { padding: 8px; border-bottom: 1px solid var(--line); flex: 0 0 auto; }

        input.txt, select.txt, textarea.txt {
            width: 100%;
            border: 1px solid var(--line);
            background: var(--bg);
            color: var(--ink);
            font: inherit;
            padding: 5px 7px;
            border-radius: 5px;
        }

        input.txt:focus, select.txt:focus, textarea.txt:focus { outline: none; border-color: var(--line2); }
        select.txt { cursor: pointer; }

        .cat {
            padding: 11px 12px 4px;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .08em;
            text-transform: uppercase;
            color: var(--faint);
        }

        .pitem {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 5px 12px;
            cursor: grab;
            user-select: none;
            color: var(--soft);
            border-left: 2px solid transparent;
        }

        .pitem:hover { background: var(--hover); color: var(--ink); border-left-color: var(--line2); }
        .pitem svg { flex: 0 0 auto; }
        .pitem span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        #ghost {
            position: fixed;
            z-index: 50;
            pointer-events: none;
            background: var(--bg);
            border: 1px solid var(--line2);
            border-radius: 7px;
            padding: 6px 10px;
            display: none;
            align-items: center;
            gap: 7px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .16);
            font-size: 12px;
        }

        /* ---------- stage ---------- */
        #stage { flex: 1 1 auto; position: relative; min-width: 0; overflow: hidden; }
        #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
        #cv.panning { cursor: grabbing; }
        #cv.panmode { cursor: grab; }

        #editor {
            position: absolute;
            display: none;
            z-index: 20;
            border: 1px solid var(--sel);
            border-radius: 4px;
            background: var(--bg);
            color: var(--ink);
            font-family: var(--sans);
            font-weight: 600;
            padding: 2px 5px;
            text-align: center;
        }

        #editor:focus { outline: none; }

        .hint {
            position: absolute;
            left: 12px;
            bottom: 10px;
            font-size: 11px;
            color: var(--faint);
            pointer-events: none;
            user-select: none;
            font-family: var(--mono);
        }

        /* ---------- inspector ---------- */
        .sec { padding: 12px; border-bottom: 1px solid var(--line); }
        .sec:last-child { border-bottom: none; }

        .lbl {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: .07em;
            text-transform: uppercase;
            color: var(--muted);
            margin: 0 0 5px;
            display: block;
        }

        .row { display: flex; gap: 7px; align-items: center; }
        .row + .row, .fld + .fld { margin-top: 9px; }
        .fld { display: block; }

        .swatches { display: flex; flex-wrap: wrap; gap: 5px; }

        .sw {
            width: 21px;
            height: 21px;
            border-radius: 5px;
            border: 1px solid rgba(128, 128, 128, .35);
            cursor: pointer;
            padding: 0;
        }

        .sw.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 3px var(--ink); }

        .seg { display: flex; border: 1px solid var(--line); border-radius: 5px; overflow: hidden; }

        .seg button {
            flex: 1 1 0;
            appearance: none;
            border: none;
            border-right: 1px solid var(--line);
            background: var(--bg);
            color: var(--muted);
            font: inherit;
            font-size: 11px;
            padding: 5px 2px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .seg button:last-child { border-right: none; }
        .seg button:hover { background: var(--hover); color: var(--ink); }
        .seg button.on { background: var(--ink); color: var(--bg); }

        .empty { color: var(--muted); line-height: 1.6; }
        .empty b { color: var(--soft); }

        kbd {
            font-family: var(--mono);
            font-size: 10.5px;
            border: 1px solid var(--line2);
            border-bottom-width: 2px;
            border-radius: 4px;
            padding: 1px 4px;
            color: var(--soft);
            background: var(--bg);
            white-space: nowrap;
        }

        .kbdlist { display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: center; }
        .kbdlist div:nth-child(even) { color: var(--muted); }

        /* icon picker */
        #iconGrid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            max-height: 168px;
            overflow-y: auto;
            border: 1px solid var(--line);
            border-radius: 5px;
            padding: 4px;
            background: var(--bg);
        }

        #iconGrid button {
            appearance: none;
            border: 1px solid transparent;
            background: transparent;
            color: var(--soft);
            border-radius: 4px;
            padding: 4px 0;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #iconGrid button:hover { background: var(--hover); color: var(--ink); }
        #iconGrid button.on { background: var(--ink); color: var(--bg); }

        .stat { font-family: var(--mono); font-size: 11px; color: var(--muted); }

        /* modal */
        #modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .38);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 100;
            padding: 20px;
        }

        #modal.open { display: flex; }

        .sheet {
            background: var(--bg);
            border: 1px solid var(--line2);
            border-radius: 10px;
            max-width: 620px;
            width: 100%;
            max-height: 84vh;
            overflow-y: auto;
            padding: 22px 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, .3);
        }

        .sheet h2 { margin: 0 0 14px; font-size: 15px; }
        .sheet h3 { margin: 18px 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
        .sheet p { color: var(--soft); line-height: 1.65; margin: 0 0 10px; }

        @media (max-width: 860px) {
            #left { width: 190px; }
            #right { width: 240px; }
        }
    </style>
</head>

        <header id="top">

            <span class="sep"></span>
            <div class="grp">
                <button class="btn" id="bZoomOut" title="Zoom out (−)">−</button>
                <span class="zoomlbl" id="zoomLbl">100%</span>
                <button class="btn" id="bZoomIn" title="Zoom in (+)">+</button>
                <button class="btn" id="bFit" title="Fit to content (F)">Fit</button>
            </div>
            <span class="spacer"></span>
            <div class="grp">
                <button class="btn" id="bSnap" title="Snap to grid">Snap</button>
                <button class="btn" id="bGrid" title="Show grid">Grid</button>
                <button class="btn" id="bTheme" title="Toggle dark mode"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16"><path d="M6 .278a.77.77 0 0 1 .08.858 7.2 7.2 0 0 0-.878 3.46c0 4.021 3.278 7.277 7.318 7.277q.792-.001 1.533-.16a.79.79 0 0 1 .81.316.73.73 0 0 1-.031.893A8.35 8.35 0 0 1 8.344 16C3.734 16 0 12.286 0 7.71 0 4.266 2.114 1.312 5.124.06A.75.75 0 0 1 6 .278"/></svg></button>
            </div>
            <span class="sep"></span>
            <div class="grp">
                <button class="btn" id="bNew" title="New diagram">New</button>
                <button class="btn" id="bOpen" title="Open .json">Open</button>
                <button class="btn primary" id="bExport" title="Export">Export ▾</button>
                <button class="btn" id="bHelp" title="Help (?)">?</button>
            </div>
            <input type="file" id="fileIn" accept=".json,application/json" hidden>
        </header>

        <div id="main">
            <aside id="left">
                <div class="panelhead">Palette</div>
                <div class="searchwrap"><input class="txt" id="palSearch" placeholder="Search nodes…" spellcheck="false"></div>
                <div class="scroll" id="palette"></div>
            </aside>

            <div id="stage">
                <svg id="cv"></svg>
                <input id="editor" spellcheck="false">
                <div class="hint" id="hint">drag a node from the palette · drag from a node's edge dot to connect</div>
            </div>

            <aside id="right">
                <div class="panelhead"><span id="inspTitle">Diagram</span></div>
                <div class="scroll" id="inspector"></div>
            </aside>
        </div>
    </div>

    <div id="ghost"></div>

    <div id="modal">
        <div class="sheet" id="sheet"></div>
    </div>
