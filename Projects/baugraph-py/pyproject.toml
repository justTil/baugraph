[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "baugraph"
dynamic = ["version"]
requires-python = ">=3.12"
description = "A python library for creating baugraph diagrams"
license = { file = "LICENSE" }
authors = [{ name = "Til Schwarze", email = "til@baugraph.com" }]
readme = "README.md"
keywords = ["baugraph", "diagram", "graph", "visualization", "architecture"]

#dependencies = ["aiokafka"]

#[project.optional-dependencies]
#dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.hatch.version]
source = "vcs"
raw-options = { local_scheme = "no-local-version" }

[tool.hatch.build.hooks.vcs]
version-file = "src/baugraph/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/baugraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
